plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.guessgame"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.guessgame"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
}
