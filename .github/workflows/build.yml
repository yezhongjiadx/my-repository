name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 删掉了容易炸的setup‑android action！改用命令安装
      - name: Install Android commandline‑tools
        run: |
          sudo apt update
          sudo apt install -y unzip wget
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076798_latest.zip
          mkdir -p ~/android/cmdline-tools
          unzip commandlinetools-linux-11076798_latest.zip -d ~/android/cmdline-tools
          mv ~/android/cmdline-tools/cmdline-tools ~/android/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=$HOME/android
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Install vcpkg manually
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install sdl2:arm64-android sdl2-ttf:arm64-android

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
