name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装SDK/NDK（使用国内镜像）
        run: |
          sudo apt update
          sudo apt install -y unzip wget
          # 使用镜像站点，避开dl.google.com
          wget https://mirror.ghproxy.com/https://dl.google.com/android/repository/commandlinetools-linux-12433296_latest.zip
          mkdir -p ~/android/cmdline-tools
          unzip commandlinetools-linux-12433296_latest.zip -d ~/android/cmdline-tools
          mv ~/android/cmdline-tools/cmdline-tools ~/android/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=$HOME/android
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: 安装vcpkg（也加上镜像加速）
        run: |
          git clone https://mirror.ghproxy.com/https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install sdl2:arm64-android sdl2-ttf:arm64-android

      - name: 赋予权限
        run: chmod +x gradlew

      - name: 构建Release包
        run: ./gradlew assembleRelease
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
